name: Validate Pull Request

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - edited

jobs:
  validate-pr:
    name: validate-pr
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # 1. VALIDAR BRANCH team-XX
      # ============================================================
      - name: Validate branch
        id: branch
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_BRANCH="${{ github.head_ref }}"

          echo "Branch recebida: $CURRENT_BRANCH"

          if [[ ! "$CURRENT_BRANCH" =~ ^team-([0-9]{2})$ ]]; then
            echo "::error::Nome de branch inválido."
            echo "::error::Use exatamente o padrão: team-XX"
            echo "::error::Exemplos: team-01, team-09, team-15"
            exit 1
          fi

          TEAM_NUMBER="${BASH_REMATCH[1]}"
          TEAM_NAME="team-${TEAM_NUMBER}"
          TEAM_LABEL="Team ${TEAM_NUMBER}"

          echo "team_number=$TEAM_NUMBER" >> "$GITHUB_OUTPUT"
          echo "team_name=$TEAM_NAME" >> "$GITHUB_OUTPUT"
          echo "team_label=$TEAM_LABEL" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 2. IDENTIFICAR ARQUIVOS MODIFICADOS
      # ============================================================
      - name: Get changed files
        id: changed
        shell: bash
        run: |
          set -euo pipefail

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          CHANGED_FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")

          echo "Arquivos modificados:"
          echo "$CHANGED_FILES"

          if [[ -z "$CHANGED_FILES" ]]; then
            echo "::error::Nenhum arquivo foi modificado neste Pull Request."
            exit 1
          fi

          {
            echo "files<<EOF"
            echo "$CHANGED_FILES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # ============================================================
      # 3. IDENTIFICAR INSTITUIÇÃO E VALIDAR DIRETÓRIO
      #
      # Estruturas permitidas:
      # teams/Teams-UNEMAT/team-XX/
      # teams/Teams-UFR/team-XX/
      #
      # Arquivos permitidos:
      # SPRINT1-5.md
      # SPRINT2-5.md / SPRINT2-5.sql
      # SPRINT3-5.md / SPRINT3-5.sql
      # SPRINT4-5.md / SPRINT4-5.sql
      # SPRINT5-5.md / SPRINT5-5.sql
      # ============================================================
      - name: Validate institution and team directory
        id: context
        shell: bash
        run: |
          set -euo pipefail

          TEAM_NAME="${{ steps.branch.outputs.team_name }}"
          CHANGED_FILES="${{ steps.changed.outputs.files }}"

          DETECTED_INSTITUTION=""
          INVALID=0

          while IFS= read -r file; do
            [[ -z "$file" ]] && continue

            echo "Validando arquivo: $file"

            if [[ "$file" =~ ^teams/Teams-(UNEMAT|UFR)/${TEAM_NAME}/SPRINT1-5\.md$ ]]; then
              CURRENT_INSTITUTION="${BASH_REMATCH[1]}"

            elif [[ "$file" =~ ^teams/Teams-(UNEMAT|UFR)/${TEAM_NAME}/SPRINT[2-5]-5\.(md|sql)$ ]]; then
              CURRENT_INSTITUTION="${BASH_REMATCH[1]}"

            else
              echo "::error file=$file::Arquivo não permitido."
              echo "::error::A branch ${TEAM_NAME} só pode alterar arquivos dentro de:"
              echo "::error::teams/Teams-UNEMAT/${TEAM_NAME}/"
              echo "::error::ou"
              echo "::error::teams/Teams-UFR/${TEAM_NAME}/"
              INVALID=1
              continue
            fi

            if [[ -z "$DETECTED_INSTITUTION" ]]; then
              DETECTED_INSTITUTION="$CURRENT_INSTITUTION"
            elif [[ "$DETECTED_INSTITUTION" != "$CURRENT_INSTITUTION" ]]; then
              echo "::error file=$file::O mesmo Pull Request não pode misturar UNEMAT e UFR."
              INVALID=1
            fi
          done <<< "$CHANGED_FILES"

          if [[ "$INVALID" -eq 1 ]]; then
            exit 1
          fi

          if [[ -z "$DETECTED_INSTITUTION" ]]; then
            echo "::error::Não foi possível identificar a instituição."
            exit 1
          fi

          TEAM_DIR="teams/Teams-${DETECTED_INSTITUTION}/${TEAM_NAME}"

          echo "institution=$DETECTED_INSTITUTION" >> "$GITHUB_OUTPUT"
          echo "team_dir=$TEAM_DIR" >> "$GITHUB_OUTPUT"

          echo "Instituição: $DETECTED_INSTITUTION"
          echo "Diretório autorizado: $TEAM_DIR"

      # ============================================================
      # 4. VALIDAR TÍTULO DO PR
      #
      # Exemplo:
      # [N1][UNEMAT][Team 09] Sprints 1-5 - Sistema de Biblioteca
      # ============================================================
      - name: Validate Pull Request title
        shell: bash
        run: |
          set -euo pipefail

          TITLE="${{ github.event.pull_request.title }}"
          INSTITUTION="${{ steps.context.outputs.institution }}"
          TEAM_LABEL="${{ steps.branch.outputs.team_label }}"

          EXPECTED_PREFIX="[N1][${INSTITUTION}][${TEAM_LABEL}] Sprints 1-5 - "

          echo "Título recebido: $TITLE"
          echo "Prefixo esperado: $EXPECTED_PREFIX"

          if [[ "$TITLE" != "$EXPECTED_PREFIX"* ]]; then
            echo "::error::Título do Pull Request inválido."
            echo "::error::Use o formato:"
            echo "::error::${EXPECTED_PREFIX}Nome do Banco"
            exit 1
          fi

          DATABASE_NAME="${TITLE#"$EXPECTED_PREFIX"}"

          if [[ -z "${DATABASE_NAME// }" ]]; then
            echo "::error::Informe o nome do banco após o hífen."
            exit 1
          fi

      # ============================================================
      # 5. EXIGIR OS 9 ARQUIVOS FINAIS
      # ============================================================
      - name: Validate required Sprint files
        shell: bash
        run: |
          set -euo pipefail

          DIR="${{ steps.context.outputs.team_dir }}"
          MISSING=0

          REQUIRED_FILES=(
            "SPRINT1-5.md"
            "SPRINT2-5.md"
            "SPRINT2-5.sql"
            "SPRINT3-5.md"
            "SPRINT3-5.sql"
            "SPRINT4-5.md"
            "SPRINT4-5.sql"
            "SPRINT5-5.md"
            "SPRINT5-5.sql"
          )

          for filename in "${REQUIRED_FILES[@]}"; do
            FILE="${DIR}/${filename}"

            if [[ ! -f "$FILE" ]]; then
              echo "::error file=$FILE::Arquivo obrigatório ausente: $filename"
              MISSING=1
            else
              echo "OK: $FILE"
            fi
          done

          if [[ "$MISSING" -eq 1 ]]; then
            echo "::error::A entrega final está incompleta."
            exit 1
          fi

      # ============================================================
      # 6. IMPEDIR ARQUIVOS VAZIOS
      # ============================================================
      - name: Validate files are not empty
        shell: bash
        run: |
          set -euo pipefail

          DIR="${{ steps.context.outputs.team_dir }}"

          FILES=(
            "SPRINT1-5.md"
            "SPRINT2-5.md"
            "SPRINT2-5.sql"
            "SPRINT3-5.md"
            "SPRINT3-5.sql"
            "SPRINT4-5.md"
            "SPRINT4-5.sql"
            "SPRINT5-5.md"
            "SPRINT5-5.sql"
          )

          for filename in "${FILES[@]}"; do
            FILE="${DIR}/${filename}"

            if [[ ! -s "$FILE" ]]; then
              echo "::error file=$FILE::O arquivo está vazio."
              exit 1
            fi
          done

      # ============================================================
      # 7. VALIDAR SPRINT 1/5
      # ============================================================
      - name: Validate SPRINT1-5 planning
        shell: bash
        run: |
          set -euo pipefail

          FILE="${{ steps.context.outputs.team_dir }}/SPRINT1-5.md"

          require_text() {
            local text="$1"
            if ! grep -Fq "$text" "$FILE"; then
              echo "::error file=$FILE::Seção obrigatória ausente: $text"
              exit 1
            fi
          }

          require_text "# 1. Identificação do aluno"
          require_text "# 2. Tema do banco de dados"
          require_text "# 3. Descrição do sistema"
          require_text "# 4. Objetivo do banco de dados"
          require_text "# 5. Escopo inicial"
          require_text "# 6. Identificação das entidades"
          require_text "# 8. Chaves primárias"
          require_text "# 9. Relacionamentos entre as entidades"
          require_text "# 10. Cardinalidade inicial"
          require_text "# 11. Chaves estrangeiras previstas"
          require_text "# 12. Restrições de integridade previstas"
          require_text "# 13. Regras de negócio"
          require_text "# 16. Perguntas que o banco deverá ser capaz de responder"
          require_text "# 18. Checklist da Sprint 1/5"

      # ============================================================
      # 8. VALIDAR SPRINT 2/5 — DOCUMENTAÇÃO
      # ============================================================
      - name: Validate SPRINT2-5 documentation
        shell: bash
        run: |
          set -euo pipefail

          FILE="${{ steps.context.outputs.team_dir }}/SPRINT2-5.md"

          for text in \
            "CREATE DATABASE" \
            "CREATE TABLE" \
            "PRIMARY KEY" \
            "FOREIGN KEY" \
            "ALTER TABLE" \
            "SPRINT2-5.sql"
          do
            if ! grep -Fqi "$text" "$FILE"; then
              echo "::error file=$FILE::A Sprint 2/5 deve documentar: $text"
              exit 1
            fi
          done

      # ============================================================
      # 9. VALIDAR SPRINT 2/5 — SQL
      # ============================================================
      - name: Validate SPRINT2-5 SQL
        shell: bash
        run: |
          set -euo pipefail

          FILE="${{ steps.context.outputs.team_dir }}/SPRINT2-5.sql"

          grep -Eqi 'CREATE[[:space:]]+DATABASE' "$FILE" || {
            echo "::error file=$FILE::O arquivo deve conter CREATE DATABASE."
            exit 1
          }

          grep -Eqi '^[[:space:]]*USE[[:space:]]+' "$FILE" || {
            echo "::error file=$FILE::O arquivo deve conter USE."
            exit 1
          }

          TABLE_COUNT=$(grep -Eic '^[[:space:]]*CREATE[[:space:]]+TABLE[[:space:]]+' "$FILE" || true)

          if [[ "$TABLE_COUNT" -lt 4 ]]; then
            echo "::error file=$FILE::O projeto deve possuir pelo menos 4 CREATE TABLE."
            exit 1
          fi

          grep -Eqi 'PRIMARY[[:space:]]+KEY' "$FILE" || {
            echo "::error file=$FILE::O arquivo deve conter PRIMARY KEY."
            exit 1
          }

          grep -Eqi 'FOREIGN[[:space:]]+KEY' "$FILE" || {
            echo "::error file=$FILE::O arquivo deve conter pelo menos uma FOREIGN KEY."
            exit 1
          }

          grep -Eqi 'ALTER[[:space:]]+TABLE' "$FILE" || {
            echo "::error file=$FILE::O arquivo deve conter ALTER TABLE."
            exit 1
          }

          if grep -Eqi '\bnome_do_banco\b|\btabela_a\b|\btabela_b\b|\btabela_c\b|\btabela_d\b|\bcampo_a1\b|\bcampo_b1\b' "$FILE"; then
            echo "::error file=$FILE::O arquivo ainda contém nomes genéricos do modelo."
            exit 1
          fi

      # ============================================================
      # 10. VALIDAR SPRINT 3/5 — DML
      # ============================================================
      - name: Validate SPRINT3-5
        shell: bash
        run: |
          set -euo pipefail

          MD="${{ steps.context.outputs.team_dir }}/SPRINT3-5.md"
          SQL="${{ steps.context.outputs.team_dir }}/SPRINT3-5.sql"

          for keyword in INSERT UPDATE DELETE; do
            grep -Eqi "$keyword" "$MD" || {
              echo "::error file=$MD::A documentação da Sprint 3/5 deve abordar ${keyword}."
              exit 1
            }

            grep -Eqi "^[[:space:]]*${keyword}[[:space:]]+" "$SQL" || {
              echo "::error file=$SQL::O SQL da Sprint 3/5 deve conter ${keyword}."
              exit 1
            }
          done

      # ============================================================
      # 11. VALIDAR SPRINT 4/5 — CONSULTAS
      # ============================================================
      - name: Validate SPRINT4-5
        shell: bash
        run: |
          set -euo pipefail

          MD="${{ steps.context.outputs.team_dir }}/SPRINT4-5.md"
          SQL="${{ steps.context.outputs.team_dir }}/SPRINT4-5.sql"

          for keyword in "SELECT" "WHERE" "ORDER BY" "GROUP BY"; do
            grep -Eqi "$keyword" "$MD" || {
              echo "::error file=$MD::A documentação da Sprint 4/5 deve abordar ${keyword}."
              exit 1
            }

            grep -Eqi "$keyword" "$SQL" || {
              echo "::error file=$SQL::O SQL da Sprint 4/5 deve conter ${keyword}."
              exit 1
            }
          done

          grep -Eqi 'HAVING|COUNT[[:space:]]*\(|SUM[[:space:]]*\(|AVG[[:space:]]*\(|MIN[[:space:]]*\(|MAX[[:space:]]*\(' "$SQL" || {
            echo "::error file=$SQL::A Sprint 4/5 deve conter HAVING e/ou funções de agregação."
            exit 1
          }

      # ============================================================
      # 12. VALIDAR SPRINT 5/5
      # ============================================================
      - name: Validate SPRINT5-5
        shell: bash
        run: |
          set -euo pipefail

          MD="${{ steps.context.outputs.team_dir }}/SPRINT5-5.md"
          SQL="${{ steps.context.outputs.team_dir }}/SPRINT5-5.sql"

          grep -Eqi 'checklist|valida|teste|revis' "$MD" || {
            echo "::error file=$MD::A Sprint 5/5 deve registrar revisão, validação ou testes finais."
            exit 1
          }

          grep -Eqi 'CREATE[[:space:]]+DATABASE' "$SQL" || {
            echo "::error file=$SQL::O SQL final deve conter CREATE DATABASE."
            exit 1
          }

          grep -Eqi 'CREATE[[:space:]]+TABLE' "$SQL" || {
            echo "::error file=$SQL::O SQL final deve conter CREATE TABLE."
            exit 1
          }

          grep -Eqi 'INSERT[[:space:]]+INTO' "$SQL" || {
            echo "::error file=$SQL::O SQL final deve conter INSERT INTO."
            exit 1
          }

          grep -Eqi 'SELECT[[:space:]]+' "$SQL" || {
            echo "::error file=$SQL::O SQL final deve conter SELECT."
            exit 1
          }

      # ============================================================
      # 13. BLOQUEAR PLACEHOLDERS ÓBVIOS NOS .MD
      # ============================================================
      - name: Validate documentation was filled
        shell: bash
        run: |
          set -euo pipefail

          DIR="${{ steps.context.outputs.team_dir }}"

          for file in \
            "$DIR/SPRINT1-5.md" \
            "$DIR/SPRINT2-5.md" \
            "$DIR/SPRINT3-5.md" \
            "$DIR/SPRINT4-5.md" \
            "$DIR/SPRINT5-5.md"
          do
            if grep -Eqi '>[[:space:]]*(Preencha aqui|Escreva aqui)[[:space:]]*$' "$file"; then
              echo "::error file=$file::Ainda existem campos obrigatórios sem resposta."
              exit 1
            fi
          done

      # ============================================================
      # 14. VALIDAR MÍNIMO DE 5 COMMITS
      # ============================================================
      - name: Validate commits
        shell: bash
        run: |
          set -euo pipefail

          COMMIT_COUNT="${{ github.event.pull_request.commits }}"

          echo "Quantidade de commits no PR: $COMMIT_COUNT"

          if [[ "$COMMIT_COUNT" -lt 5 ]]; then
            echo "::error::A entrega deve possuir pelo menos 5 commits."
            echo "::error::Realize pelo menos um commit por Sprint."
            exit 1
          fi

      # ============================================================
      # 15. RESULTADO FINAL
      # ============================================================
      - name: Validation completed
        run: |
          echo "=================================================="
          echo "PULL REQUEST VALIDADO COM SUCESSO"
          echo "Instituição: ${{ steps.context.outputs.institution }}"
          echo "Branch:      ${{ steps.branch.outputs.team_name }}"
          echo "Autor PR:    ${{ github.event.pull_request.user.login }}"
          echo "Destino:     main"
          echo "=================================================="
