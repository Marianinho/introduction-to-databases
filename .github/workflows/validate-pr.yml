name: Validate Pull Request

on:
  pull_request:
    branches:
      - main

jobs:
  validate-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate changed files
        run: |
          echo "Checking changed files..."

          CHANGED_FILES=$(git diff --name-only origin/main...HEAD)

          echo "$CHANGED_FILES"

          INVALID_FILES=0

          for file in $CHANGED_FILES; do
            if [[ "$file" != teams/team-*.md ]]; then
              echo "Invalid file changed: $file"
              INVALID_FILES=1
            fi
          done

          if [[ $INVALID_FILES -eq 1 ]]; then
            echo "Students can only edit files inside /teams/"
            exit 1
          fi

      - name: Validate required sections
        run: |
          CHANGED_FILES=$(git diff --name-only origin/main...HEAD | grep '^teams/team-.*\.md$' || true)

          for file in $CHANGED_FILES; do
            echo "Validating $file"

            grep -q "## Integrantes" "$file" || (echo "Missing: ## Integrantes" && exit 1)
            grep -q "# Descrição" "$file" || (echo "Missing: # Descrição" && exit 1)
            grep -q "# CREATE TABLE" "$file" || (echo "Missing: # CREATE TABLE" && exit 1)
            grep -q "# INSERT INTO" "$file" || (echo "Missing: # INSERT INTO" && exit 1)
            grep -q "# CONSULTAS SQL" "$file" || (echo "Missing: # CONSULTAS SQL" && exit 1)
            grep -q "# JOIN" "$file" || (echo "Missing: # JOIN" && exit 1)
            grep -q "# Screenshots" "$file" || (echo "Missing: # Screenshots" && exit 1)
          done
